name: Lampa Rescue checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax-and-safety:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check JavaScript syntax
        run: |
          node --check lampa-rescue.js
          node --check lampa-rescue-core.js
          node --check lampa-rescue-filmix.js
          node --check lampa-rescue-experimental-bundle.js
          node --check tests/check-source.js
          node --check tests/runtime.test.js
          node --check tests/diagnostic-init.test.js

      - name: Run static regression checks
        run: node tests/check-source.js

      - name: Run runtime regression tests with mocked Lampa
        run: node tests/runtime.test.js

      - name: Run diagnostic plugin startup regression test
        run: node tests/diagnostic-init.test.js
